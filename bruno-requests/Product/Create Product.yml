info:
  name: Create Product
  type: http
  seq: 3

http:
  method: POST
  url: "{{catalogUrl}}/api/v1/products"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Notebook Pro 15",
        "brand": "Acme",
        "description": "15 inch developer notebook",
        "regularPrice": 5000.00,
        "salePrice": 4500.00,
        "categoryId": "{{categoryId}}",
        "enabled": true
      }
  auth: inherit
  variables:
    - name: categoryId
      value: 1b7c4d2e-8f3a-4c5b-9d6e-0a1b2c3d4e5f
      local: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
