info:
  name: List Products
  type: http
  seq: 1

http:
  method: GET
  url: "{{catalogUrl}}/api/v1/products?number=0&size=15"
  params:
    - name: number
      value: "0"
      type: query
    - name: size
      value: "15"
      type: query
  headers:
    - name: Accept
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
