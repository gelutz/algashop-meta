opencollection: 1.0.0

info:
  name: Algashop
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: url
      value: http://localhost:8089
      description: Application endpoint
    - name: orderingUrl
      value: http://localhost:8080
      description: Ordering microservice endpoint
    - name: catalogUrl
      value: http://localhost:8080
      description: Product catalog microservice endpoint
    - name: wireMockUrl
      value: http://localhost:8187
      description: Wiremock endpoint
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
