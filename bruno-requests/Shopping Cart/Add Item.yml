info:
  name: Add Item
  type: http
  seq: 4

http:
  method: POST
  url: "{{orderingUrl}}/api/v1/shopping-carts/{{shoppingCartId}}/items"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "productId": "{{productId}}",
        "quantity": 1
      }
  auth: inherit
  variables:
    - name: shoppingCartId
      value: 3f2a1c9e-7b4d-4a8e-9c1b-2d5e6f7a8b90
      local: true
    - name: productId
      value: 28fcd9fb-4ce7-44d6-9583-14d8b3dc5aff
      local: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
