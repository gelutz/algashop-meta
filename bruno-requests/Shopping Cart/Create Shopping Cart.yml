info:
  name: Create Shopping Cart
  type: http
  seq: 1

http:
  method: POST
  url: "{{orderingUrl}}/api/v1/shopping-carts"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "customerId": "{{customerId}}"
      }
  auth: inherit

runtime:
  variables:
    - name: customerId
      value: "2c65f7f8-baf8-4b8f-9c1e-5210bf4a2c65 "

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
