info:
  name: Filter Customers
  type: http
  seq: 3

http:
  method: GET
  url: "{{orderingUrl}}/api/v1/customers?email=john.doe@example.com&firstName=John&sortByProperty=FIRST_NAME&sortDirection=ASC&page=0&size=15"
  params:
    - name: email
      value: john.doe@example.com
      type: query
    - name: firstName
      value: John
      type: query
    - name: sortByProperty
      value: FIRST_NAME
      type: query
      description: REGISTERED_AT or FIRST_NAME
    - name: sortDirection
      value: ASC
      type: query
      description: ASC or DESC
    - name: page
      value: "0"
      type: query
    - name: size
      value: "15"
      type: query
  headers:
    - name: Accept
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
