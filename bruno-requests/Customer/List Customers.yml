info:
  name: List Customers
  type: http
  seq: 2

http:
  method: GET
  url: "{{orderingUrl}}/api/v1/customers?page=0&size=15"
  params:
    - name: page
      value: "0"
      type: query
    - name: size
      value: "15"
      type: query
  headers:
    - name: Accept
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
