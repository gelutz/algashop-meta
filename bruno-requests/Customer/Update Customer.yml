info:
  name: Update Customer
  type: http
  seq: 5

http:
  method: PUT
  url: "{{orderingUrl}}/api/v1/customers/{{customerId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "firstName": "John",
        "lastName": "Doe Updated",
        "phone": "478-256-2604",
        "promotionNotificationsAllowed": false,
        "address": {
          "street": "Bourbon Street",
          "number": "1134",
          "complement": "Apt. 114",
          "neighborhood": "North Ville",
          "city": "Yoststad",
          "state": "South Carolina",
          "zipCode": "12345"
        }
      }
  auth: inherit
  variables:
    - name: customerId
      value: 8cd8c4b1-2b0d-4b1a-9f1c-6a3f4b1d2e5c
      local: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
