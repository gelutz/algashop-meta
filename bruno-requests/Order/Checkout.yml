      value: application/vnd.order-with-shopping-cart.v1+json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "shoppingCartId": "{{shoppingCartId}}",
        "paymentMethod": "CREDIT_CARD",
        "shipping": {
          "recipient": {
            "firstName": "John",
            "lastName": "Doe",
            "document": "255-08-0578",
            "phone": "478-256-2604"
          },
          "address": {
            "street": "Bourbon Street",
            "number": "1134",
            "complement": "Apt. 114",
            "neighborhood": "North Ville",
            "city": "Yoststad",
            "state": "South Carolina",
            "zipCode": "12345"
          }
        },
        "billing": {
          "firstName": "John",
          "lastName": "Doe",
          "document": "255-08-0578",
          "phone": "478-256-2604",
          "email": "john.doe@example.com",
          "address": {
            "street": "Bourbon Street",
            "number": "1134",
            "complement": "Apt. 114",
            "neighborhood": "North Ville",
            "city": "Yoststad",
            "state": "South Carolina",
            "zipCode": "12345"
          }
        }
      }
  auth: inherit
  variables:
    - name: shoppingCartId
      value: 3f2a1c9e-7b4d-4a8e-9c1b-2d5e6f7a8b90
