info:
  name: Filter Orders
  type: http
  seq: 2

http:
  method: GET
  url: "{{orderingUrl}}/api/v1/orders?status=PLACED&customerId={{customerId}}&sortByProperty=PLACED_AT&sortDirection=DESC&page=0&size=15"
  params:
    - name: status
      value: PLACED
      type: query
    - name: customerId
      value: "{{customerId}}"
      type: query
    - name: sortByProperty
      value: PLACED_AT
      type: query
      description: STATUS, PLACED_AT, PAID_AT, READY_AT, CANCELED_AT or ID
    - name: sortDirection
      value: DESC
      type: query
      description: ASC or DESC
    - name: page
      value: "0"
      type: query
    - name: size
      value: "15"
      type: query
    - name: placedAtFrom
      value: 2025-01-01T00:00:00Z
      type: query
      disabled: true
    - name: placedAtTo
      value: 2026-12-31T23:59:59Z
      type: query
      disabled: true
    - name: totalAmountFrom
      value: "0"
      type: query
      disabled: true
    - name: totalAmountTo
      value: "1000"
      type: query
      disabled: true
  headers:
    - name: Accept
      value: application/json
  auth: inherit
  variables:
    - name: customerId
      value: 8cd8c4b1-2b0d-4b1a-9f1c-6a3f4b1d2e5c
      local: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
