info:
  name: Find Order by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{orderingUrl}}/api/v1/orders/{{orderId}}"
  headers:
    - name: Accept
      value: application/json
  auth: inherit
  variables:
    - name: orderId
      value: "01001010000000000000000000"
      local: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
