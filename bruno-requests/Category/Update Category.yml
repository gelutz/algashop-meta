info:
  name: Update Category
  type: http
  seq: 4

http:
  method: PUT
  url: "{{catalogUrl}}/api/v1/categories/{{categoryId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Notebooks and Laptops",
        "enabled": true
      }
  auth: inherit
  variables:
    - name: categoryId
      value: 1b7c4d2e-8f3a-4c5b-9d6e-0a1b2c3d4e5f
      local: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
